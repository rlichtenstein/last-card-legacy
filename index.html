<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A legacy campaign card game: personal decks, stickers, torn cards, sealed boxes and new rules that unlock as you play.">
<meta name="theme-color" content="#5A3ED0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Last Card">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Last Card Legacy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a game table. Players across the top, the felt with the draw and discard piles,
   your hand under it, and the Legacy shelf (sealed boxes, the deck ledger, rules, story)
   beside it on wide screens and below it on phones. */
:root{
  --bg:#E4E8EF; --surface:#F5F7FA; --surface-2:#D9DFE8; --ink:#141922; --muted:#566072; --line:#C1C8D4;
  --accent:#5A3ED0; --accent-ink:#FFFFFF; --focus:#1E66D0; --danger:#B3261E; --good:#1C7C48;
  --felt:#1F2E45; --felt-2:#2A3D5A; --felt-ink:#EEF2F8; --felt-muted:#A8B5CA;
  --red:#D8392B; --blue:#1F63C6; --yellow:#E9AC0C; --green:#1E9153; --wild:#1B1C25;
  --edge:#FFFFFF; --back:#2C2266; --back-2:#463A9A;
  --own0:#5A3ED0; --own1:#0B7F86; --own2:#B0306E; --own3:#8A5A22;
  --legacy:#F7F4EA; --legacy-ink:#211F1A; --legacy-muted:#6A6455; --tape:rgba(232,214,160,.86);
  --gold:#F0BE2E; --mud:#7A5530; --glue:#D8DEE7; --bomb:#16171C;
  --font-display:'Bricolage Grotesque','Arial Black','Helvetica Neue',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --surface:#181C25; --surface-2:#222836; --ink:#E8ECF3; --muted:#9BA5B6; --line:#30384A;
    --accent:#A18CFF; --accent-ink:#140E33; --focus:#7FB0FF; --danger:#F07167; --good:#4CC488;
    --felt:#16233A; --felt-2:#203252; --felt-ink:#EEF2F8; --felt-muted:#A3B1C8;
    --red:#E24A3B; --blue:#3477DD; --yellow:#F0B92A; --green:#25A562; --wild:#101118;
    --edge:#F4F5F8; --back:#2A2163; --back-2:#4A3EA6;
    --own0:#7B63E6; --own1:#17979E; --own2:#C8457F; --own3:#A6733A;
    --legacy:#ECE7D8; --legacy-ink:#1E1C17; --legacy-muted:#5E584A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#181C25; --surface-2:#222836; --ink:#E8ECF3; --muted:#9BA5B6; --line:#30384A;
  --accent:#A18CFF; --accent-ink:#140E33; --focus:#7FB0FF; --danger:#F07167; --good:#4CC488;
  --felt:#16233A; --felt-2:#203252; --felt-ink:#EEF2F8; --felt-muted:#A3B1C8;
  --red:#E24A3B; --blue:#3477DD; --yellow:#F0B92A; --green:#25A562; --wild:#101118;
  --edge:#F4F5F8; --back:#2A2163; --back-2:#4A3EA6;
  --own0:#7B63E6; --own1:#17979E; --own2:#C8457F; --own3:#A6733A;
  --legacy:#ECE7D8; --legacy-ink:#1E1C17; --legacy-muted:#5E584A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
button{font:inherit;color:inherit}
input{font:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.shell{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;color:var(--muted)}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,7.4vw,50px);line-height:.86;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.18em}
.wordmark .tag{font-size:.38em;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;transform:translateY(-.25em)}
.handtag{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.handtag b{font-family:var(--font-display);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.track{display:flex;gap:3px}
.track i{width:10px;height:10px;border-radius:3px;background:var(--line);display:block}
.track i.done{background:var(--accent)}
.track i.now{background:var(--ink)}

/* Players */
.players{display:grid;grid-template-columns:repeat(var(--pn,4),minmax(0,1fr));gap:8px}
@media (max-width:620px){.players.n4{grid-template-columns:repeat(2,minmax(0,1fr))}.pchip .who{display:none}.pchip{padding:7px 9px}.pchip .pn{font-size:15px}}
.pchip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.pchip:hover{border-color:var(--muted)}
.pchip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pchip.turn{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pchip .pn{font-weight:700;font-size:16px;white-space:nowrap;display:flex;gap:6px;align-items:center;min-width:0}
.pchip .pname{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pchip .seatic{flex:none;color:var(--muted);display:inline-flex}
.pchip .seatic .ic{width:17px;height:17px}
@media (max-width:560px){.players.n3 .pchip .initial{display:none}.players.n3 .pchip{border-left:6px solid var(--oc);padding-left:8px}.players.n3 .pchip .pn{gap:4px}}
.pchip .who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pchip .nums{display:flex;gap:4px 12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.pchip .nums b{color:var(--ink);font-size:18px;font-family:var(--font-display);font-weight:800}
.pchip .star{color:var(--gold)}
.initial{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 4px;border-radius:7px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.02em;flex:none}
.lastflag{position:absolute;top:-8px;right:8px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 8px}

/* Table */
.table{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px;align-items:start}
@media (max-width:980px){.table{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:12px;min-width:0}
.felt{background:radial-gradient(120% 90% at 50% 20%,var(--felt-2),var(--felt));color:var(--felt-ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.piles{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,30px);flex-wrap:wrap}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--felt-muted);font-size:13px;font-weight:700}
.pile.drawable{cursor:pointer}
.pile.drawable:hover .card{transform:translateY(-3px)}
.pilestack{position:relative}
.pilestack .card+.card{position:absolute;left:4px;top:-4px}
.state{display:flex;flex-direction:column;gap:8px;min-width:96px}
.colorchip{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.colorchip i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid var(--felt-ink);flex:none}
.colorchip i + i{margin-left:-14px}
.dirchip{display:flex;align-items:center;gap:6px;color:var(--felt-muted);font-weight:700;font-size:14px}
.dirchip svg{width:22px;height:22px}
.pendchip{background:var(--danger);color:#fff;font-weight:800;border-radius:999px;padding:3px 10px;font-size:14px;align-self:flex-start}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--felt-muted);min-height:3.6em}
.feed li:last-child{color:var(--felt-ink);font-weight:700}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.status h2{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.1}
.status p{color:var(--muted);font-size:15px;flex-basis:100%}
.handbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hand{display:flex;flex-wrap:wrap;gap:6px}
.hand .card{--cw:56px}
@media (min-width:700px){.hand .card{--cw:70px}}
.felt .topc .card{--cw:96px}
.felt .drawc .card{--cw:76px}
@media (max-width:520px){.felt .topc .card{--cw:82px}.felt .drawc .card{--cw:62px}.piles{gap:14px;flex-wrap:nowrap}.state{min-width:0}.colorchip{font-size:16px}.dirchip{font-size:13px}}
.hand .cardbtn{border:0;background:none;padding:0;border-radius:11px;cursor:pointer;transition:transform .14s ease}
.hand .cardbtn.dim{opacity:.42}
.hand .cardbtn.sel{transform:translateY(-8px)}
.hand .cardbtn.sel .card{box-shadow:0 0 0 3px var(--accent),0 6px 14px rgba(0,0,0,.25)}
.hand .cardbtn.new .card{box-shadow:0 0 0 3px var(--gold)}
.cardbtn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;line-height:1.15}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.call{background:var(--danger);color:#fff;border-color:transparent;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.01em}
.btn.called{background:var(--surface-2);color:var(--good);border-color:var(--good)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.drew{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:12px;scroll-margin:16px}
.drew.dead{border-color:var(--line)}
.drew h2{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.1}
.drew p{color:var(--muted);font-size:15px;margin-top:4px}
.drew .actions{margin-top:10px}
.drewtext{min-width:0}
.latecall{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--danger);border-radius:var(--r);padding:10px 12px}
.latecall > span{font-size:16px;flex:1 1 200px;min-width:0}
.inspect{border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.inspect .card{--cw:64px}
.inspect h4{font-size:17px}
.inspect p{font-size:15px;color:var(--muted);margin-top:2px}
.inspect .actions{margin-top:8px}
.stkline{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:14.5px}
.stkline .stk{position:static;flex:none;--cw:60px}

/* Playing cards */
.card{--cw:60px;--suit:var(--wild);width:var(--cw);aspect-ratio:5/7;max-width:100%;border-radius:calc(var(--cw)*.14);background:var(--suit);border:calc(var(--cw)*.05) solid var(--edge);
  position:relative;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden;flex:none;font-family:var(--font-display);display:block}
.card.s-red{--suit:var(--red)} .card.s-blue{--suit:var(--blue)} .card.s-yellow{--suit:var(--yellow)} .card.s-green{--suit:var(--green)} .card.s-wild{--suit:var(--wild)}
.card .em{position:absolute;left:50%;top:50%;width:84%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:.2;color:#fff;display:block}
.card .em svg{width:100%;height:100%;display:block}
.card.s-yellow .em{color:#1A1406;opacity:.14}
.card.custom .br{display:none}
.card .big{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.5);line-height:1;text-shadow:0 calc(var(--cw)*.025) 0 rgba(0,0,0,.28);letter-spacing:-.03em}
.card .big svg{width:calc(var(--cw)*.5);height:calc(var(--cw)*.5);filter:drop-shadow(0 calc(var(--cw)*.02) 0 rgba(0,0,0,.25))}
.card .cn{position:absolute;font-weight:800;font-size:calc(var(--cw)*.2);line-height:1;display:flex;align-items:center}
.card .cn svg{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2)}
.card .tl{left:7%;top:5%} .card .br{right:7%;bottom:5%;transform:rotate(180deg)}
.card.s-yellow{color:#1A1406}
.card.s-yellow .big{text-shadow:0 calc(var(--cw)*.02) 0 rgba(255,255,255,.35)}
.card .wheelbig{width:calc(var(--cw)*.62);height:calc(var(--cw)*.62)}
.card .over{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.36);text-shadow:0 0 calc(var(--cw)*.06) #000,0 0 calc(var(--cw)*.03) #000}
.card .over svg{width:calc(var(--cw)*.34);height:calc(var(--cw)*.34)}
.card .cname{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font-family:var(--font-body);font-weight:700;font-size:calc(var(--cw)*.13);line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.4);overflow:hidden;max-height:2.2em}
.card.s-yellow .cname{text-shadow:none}
.card.custom .big{align-items:start;padding-top:22%}
.card .stks{position:absolute;right:4%;top:4%;display:flex;flex-direction:column;gap:2px}
.stk{width:calc(var(--cw)*.3);height:calc(var(--cw)*.3);border-radius:50%;display:grid;place-items:center;border:1.5px solid #14161C;font-family:var(--font-body);font-weight:800;font-size:calc(var(--cw)*.12);line-height:1;color:#14161C;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.35)}
.stk svg{width:68%;height:68%}
.stk.sig{background:#fff} .stk.grudge{background:#14161C;color:#FF6B5B;border-color:#FF6B5B}
.stk.plus{background:#FFE14A} .stk.mud{background:var(--mud);color:#E8C9A0} .stk.glue{background:var(--glue);color:#6F7A8C}
.stk.crown{background:var(--gold)} .stk.rainbow{background:#fff} .stk.bomb{background:var(--bomb);color:#F7A21B;border-color:#F7A21B}
.card.back{background:repeating-linear-gradient(135deg,var(--back) 0 9%,var(--back-2) 9% 18%)}
.card.back .lc{position:absolute;inset:16% 12%;border-radius:calc(var(--cw)*.1);background:var(--back);display:grid;place-items:center;font-weight:800;color:#fff;font-size:calc(var(--cw)*.26);letter-spacing:-.04em;border:calc(var(--cw)*.025) solid rgba(255,255,255,.55)}
.card.back .bars{position:absolute;left:12%;right:12%;bottom:7%;height:5%;display:flex;gap:3%}
.card.back .bars i{flex:1;border-radius:2px}
.card.frank .half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.card.frank .half.l{left:0} .card.frank .half.r{right:0}
.card.frank .half .big{font-size:calc(var(--cw)*.34)}
.card.frank .half .big svg{width:calc(var(--cw)*.32);height:calc(var(--cw)*.32)}
.card.frank .tapeband{position:absolute;left:41%;width:18%;top:-6%;bottom:-6%;background:var(--tape);transform:rotate(4deg);box-shadow:0 0 2px rgba(0,0,0,.2)}
/* A Blankenstein's drawn half: paper-white with a marker outline of its color. */
.card.frank .half.blankhalf{background:#FBFAF5;color:var(--card-ink,#1E1F1B);box-shadow:inset 0 0 0 calc(var(--cw)*.05) var(--hc,currentColor)}
.card.frank .half.blankhalf.bgs-red{--hc:var(--red);color:var(--red)} .card.frank .half.blankhalf.bgs-blue{--hc:var(--blue);color:var(--blue)}
.card.frank .half.blankhalf.bgs-yellow{--hc:var(--yellow);color:#8A6400} .card.frank .half.blankhalf.bgs-green{--hc:var(--green);color:var(--green)}
.card.frank .half.blankhalf .big{text-shadow:none;font-family:'Comic Sans MS','Marker Felt','Segoe Print',var(--font-display),cursive}
/* Dual-color: two colors split on the diagonal. */
.card.dual .dualbg{position:absolute;inset:0;background:linear-gradient(135deg,var(--ca) 0 50%,var(--cb) 50% 100%)}
.card.dual{color:#fff}
.card.dual .big,.card.dual .cn{color:#fff;text-shadow:0 calc(var(--cw)*.03) 0 rgba(0,0,0,.45),0 0 calc(var(--cw)*.06) rgba(0,0,0,.35)}
.card.dual .big{z-index:1}
.card.torn{clip-path:polygon(0 0,46% 0,52% 9%,45% 20%,55% 33%,47% 46%,56% 58%,46% 71%,54% 84%,48% 100%,0 100%);opacity:.8}
.bgs-red{background:var(--red)} .bgs-blue{background:var(--blue)} .bgs-yellow{background:var(--yellow);color:#1A1406} .bgs-green{background:var(--green)} .bgs-wild{background:var(--wild)}

/* Steps between hands */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.05}
.panel .lede{color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}
.rrow{text-align:left;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rrow .place{font-family:var(--font-display);font-weight:800;font-size:22px;text-align:center}
.rrow .rn{font-weight:700}
.rrow .rgain{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--good);white-space:nowrap}
.rrow .rsub{grid-column:2/-1;font-size:13.5px;color:var(--muted)}
.rrow .left{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px;--cw:32px}
.rrow .left .card{--cw:32px;border-width:1.5px}
.rrow .left .card.torn{clip-path:none;opacity:.5;outline:2px dashed var(--danger);outline-offset:1px}
.rsub.tornline{color:var(--danger);font-weight:700}
.standings{display:flex;flex-wrap:wrap;gap:6px 14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.standings b{color:var(--ink)}
.lcard{border-radius:16px;padding:18px 18px 16px;max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.lcard.back{background:var(--back);color:#F2EEFF;min-height:260px;justify-content:space-between;box-shadow:4px 4px 0 #14102F,8px 8px 0 rgba(44,34,102,.45)}
.lcard.back .no{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.8}
.lcard.back .trig{font-size:18px;line-height:1.35}
.lcard.back .lg{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.lcard.face{background:var(--legacy);color:var(--legacy-ink);border:1px solid #CFC8B4;box-shadow:4px 4px 0 rgba(0,0,0,.12)}
.lcard.face .no{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--legacy-muted)}
.lcard.face h3{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.lcard.face p{font-size:16.5px;line-height:1.42}
.lcard .ctx{background:rgba(90,62,208,.12);border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px}
.lcard.face.rulecard{border-top:6px solid var(--danger)}
.rulecard h4{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--legacy-muted);margin-top:6px}

/* =====================================================================
   ENGINE — the rules of the hand, the stickers, and the campaign between
   hands. No drawing code lives here, so it can be tested on its own.
   ===================================================================== */
const COLORS = ['red', 'blue', 'yellow', 'green'];
const STICKER_KEYS = ['sig', 'grudge', 'plus', 'mud', 'glue', 'crown', 'rainbow', 'bomb'];
const REMOVABLE = ['mud', 'glue', 'plus', 'bomb', 'grudge'];
const rnd = n => Math.floor(Math.random() * n);
const pickOne = a => a[rnd(a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

const C = (S, id) => S.camp.cards[id];
const nm = (S, p) => S.camp.names[p];
/* Every card belongs to one player's deck (card.own). Cards still in a sealed box or the Supply have no owner yet. */
const CAMPAIGN_VERSION = 2;
const MIN_DECK = 15;
const SWAP_NUM = 5, PASS_NUM = 0;   /* Fives and Zeros */
const deckIds = camp => camp.order.filter(id => !camp.cards[id].torn && camp.cards[id].own != null);
const ownDeck = (camp, p) => deckIds(camp).filter(id => camp.cards[id].own === p);
const deckSize = (camp, p) => ownDeck(camp, p).length;
/* A card can be torn only if its owner's deck stays at MIN_DECK or above. */
const tearable = (camp, id) => camp.cards[id].own != null && deckSize(camp, camp.cards[id].own) > MIN_DECK;
const colorName = c => c === 'wild' ? 'Wild' : CONTENT.colors[c].name;

/* ---------- faces ---------- */
function faceOf(card) {
  if (card.k === 'frank') return card.h[0];
  if (card.k === 'custom') {
    if (card.c === 'wild') return { c: 'wild', k: 'cwild', eff: card.eff || 'none', nm: card.nm };
    if (card.eff === 'num') return { c: card.c, k: 'num', n: card.n, nm: card.nm };
    return { c: card.c, k: card.eff, nm: card.nm };
  }
  const f = { c: card.c, k: card.k };
  if (card.k === 'num') { f.n = card.n; if (card.c2) f.c2 = card.c2; }
  return f;
}
/* A Frankencard or Blankenstein has two halves the player picks between. A dual-color card is one face with two colors (c and c2): both always count. */
const isDual = card => card.k === 'num' && !!card.c2;
const facesOf = card => card.k === 'frank' ? card.h : [faceOf(card)];
const symOf = f => f.k === 'num' ? 'n' + f.n : f.k;

    if (st.k === 'blanken') { const d = pk.design; const inp = document.getElementById('dname'); if (inp) d.nm = inp.value; sel.design = { c: d.c, eff: d.eff, n: d.n, nm: d.nm }; sel.half = pk.half; }
    pushUndo(nm(S, st.p) + ': ' + taskTitle(st));
    if (doTask(S, sel)) { ui.pick = {}; afterChange(); }
    else { ui.undo.pop(); toast('That choice doesn’t fit. Pick again.'); }
  },
  taskskip: () => { const st = S.camp.queue[0]; pushUndo(nm(S, st.p) + ' skipping: ' + taskTitle(st)); ui.pick = {}; skipTask(S); afterChange(); },
  deckf: el => { ui.deckF = el.dataset.id; ui.deckSel = null; render(); },
  deckcard: el => { ui.deckSel = ui.deckSel === el.dataset.id ? null : el.dataset.id; render(); },
  bot: el => { const p = +el.dataset.id; setSeat(p, !S.camp.bots[p]); },
  seat: el => { ui.sheet = { k: 'seat', p: +el.dataset.id }; ui.play = null; render(); },
  rulecard: el => { ui.sheet = { k: 'rulecard', id: el.dataset.id }; ui.play = null; render(); },
  setseat: el => { const [p, b] = el.dataset.id.split(':').map(Number); setSeat(p, b === 1); },
  reset: () => { ui.confirm = { text: 'Erase the whole campaign? Every sticker, tear and new card goes back in the box.', yes: 'Erase it', fn: wipe }; render(); },
  newcamp: () => { ui.confirm = { text: 'Start a fresh campaign with a brand-new deck?', yes: 'Start over', fn: wipe }; ui.tab = 'story'; render(); },
  confirmyes: () => { const f = ui.confirm && ui.confirm.fn; ui.confirm = null; if (f) f(); else render(); },
  confirmno: () => { ui.confirm = null; render(); }
};
/* Switch a seat between a person and the computer. Works mid-hand and between hands; the computer picks up wherever that seat is. */
function setSeat(p, bot) {
  const camp = S.camp;
  ui.sheet = null; ui.play = null; ui.sel = null;
  if (!!camp.bots[p] === bot) { render(); return; }
  if (bot && humans(S).length === 1) { toast('At least one seat has to be a person.'); render(); return; }
  camp.bots[p] = bot;
  if (bot && ui.handedTo === p) ui.handedTo = null;
  toast(nm(S, p) + (bot ? ' is now played by the computer.' : ' is back in human hands.'));
  afterChange();
}
function defaultName(d) { const list = CONTENT.botNames[d.eff] || ['Mystery']; return d.eff === 'num' ? list[0] + ' ' + d.n : list[0]; }
/* Clears the campaign on this device and goes back to the setup screen, keeping the old seats filled in. */
function dropCampaign(msg) {
  if (S) {
    const allPeople = !S.camp.bots.some(Boolean);
    ui.setup.n = S.camp.n;
    ui.setup.bots = S.camp.bots.concat([!allPeople, !allPeople, !allPeople, !allPeople]).slice(0, 4);
    ui.setup.names = S.camp.names.concat(['', '', '', '']).slice(0, 4).map((n, i) => ui.setup.bots[i] && /^Computer \d$/.test(n) ? '' : n);
  }
  S = null; ui.sel = null; ui.pick = {}; ui.flipped = false; ui.sheet = null; ui.play = null; ui.confirm = null; ui.undo = []; ui.handedTo = null;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  render();
  if (msg) toast(msg);
}
function wipe() {
  const ended = S ? started(S) : Date.now();
  dropCampaign();
  if (dbRef) dbWrite({ v: 1, reset: Date.now(), ended, state: null });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = H[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.seat != null) ui.setup.names[+t.dataset.seat] = t.value;
  if (t.id === 'dname' && ui.pick.design) {
    ui.pick.design.nm = t.value;
    const pv = document.getElementById('dpreview'); if (pv) pv.innerHTML = designPreview();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; ui.play = null; render(); }
});

/* ---------- boot ---------- */
const isCurrent = st => !!(st && st.camp && st.camp.v === CAMPAIGN_VERSION);
function boot(hot) {
  if (hot && hot.S) S = hot.S;
  else { const d = loadLocal(); if (d) S = d.state; }
  /* A campaign from the shared-deck version can't continue: go back to setup with the same players filled in. */
  if (S && !isCurrent(S)) { dropCampaign(); toast('The game now gives everyone their own deck, so the campaign starts fresh.'); }
  render();
  initDb();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot(window.claude && window.claude.hot ? window.claude.hot.data : {});
</script>
